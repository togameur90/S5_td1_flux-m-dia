<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Exercice 4</title>
</head>
<body>
    <h1>Exercice 4 : Propriétés des pistes</h1>
    <p>Ouvrez la console de votre navigateur (F12) pour voir les informations de la piste vidéo.</p>
    
    <video id="video" height="240">Flux vidéo non-disponible.</video>

    <script>
    const constraints = { audio: false, video: true };
    let video = document.querySelector("video");
    
    navigator.mediaDevices.getUserMedia(constraints)
        .then((stream) => { 
            video.srcObject = stream;

            const tracks = stream.getTracks();
            
            tracks.forEach((track) => {
                console.log(`--- Piste ${track.kind} ---`);
                console.log(`Label : ${track.label}`);
                console.log(`ID : ${track.id}`);
                
                if (track.getCapabilities) {
                    console.log("Capacités (Capabilities) :", track.getCapabilities());
                } else {
                    console.log("Capacités (Capabilities) : Non supporté par le navigateur");
                }
                
                console.log("Paramètres courants (Settings) :", track.getSettings());
            });

            video.onloadedmetadata = (e) => {
                if (video.hasAttribute('width')) {
                    const width = video.getAttribute('width');
                    const height = width * video.videoHeight / video.videoWidth;
                    video.setAttribute('height', height);
                }
                else if (video.hasAttribute('height')) {
                    const height = video.getAttribute('height');
                    const width = height * video.videoWidth / video.videoHeight;
                    video.setAttribute('width', width);
                }
                video.play();
            };
        })
        .catch((err) => { 
            console.error(err); 
        });
    </script>
</body>
</html>
